# Cover swapping and the application's pre-main initialization. The application
# takes over at 15 seconds; MCUboot feeds between flash/hash operations.
CONFIG_WATCHDOG=y
CONFIG_BOOT_WATCHDOG_SETUP_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_INSTALL_TIMEOUT_AT_BOOT=y
# Longer swap/startup budget; the application reprograms IWDG to 15 seconds.
# MCUboot's 300-second default exceeds the STM32H563 IWDG range.
CONFIG_BOOT_WATCHDOG_TIMEOUT_MS=30000
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
