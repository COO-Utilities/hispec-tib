# Bring-up diagnostics. Thread names and monitor data feed thread_analyzer and
# crash output; keep enabled while stack sizing and worker ownership are moving.
# Later removal command: set these three symbols to n after thread stacks settle.
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y

# Assertions and stack sentinels are useful during board bring-up because they
# fail close to the bad API use or stack overflow. Production firmware may turn
# them off after field soak testing.
# Later removal command: set CONFIG_ASSERT=n and CONFIG_STACK_SENTINEL=n.
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y

# General OS and logging. Immediate mode keeps console output simple during
# bring-up, but it can perturb timing because logs are printed in caller context.
# Later removal command for timing-sensitive releases: set
# CONFIG_LOG_MODE_IMMEDIATE=n and use deferred logging.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# Global rate-limit support. Code still has to use LOG_*_RATELIMIT_* at repeated
# call sites; this does not automatically throttle every LOG_ERR.
CONFIG_LOG_RATELIMIT=y
CONFIG_LOG_RATELIMIT_INTERVAL_MS=10000

# Per-subsystem debug controls. ADC and I2C are intentionally verbose for board
# bring-up. NVS/GPIO debug is explicitly off because those logs are currently not
# useful enough to justify console volume.
# Later removal command: delete the explicit =n lines after defaults are trusted.
CONFIG_NVS_LOG_LEVEL_DBG=n
CONFIG_ADC_LOG_LEVEL_DBG=y
CONFIG_GPIO_LOG_LEVEL_DBG=n
CONFIG_I2C_LOG_LEVEL_DBG=y

# Main and system-workqueue stacks. Networking, MQTT, settings, and JSON parsing
# all run early enough that conservative stack sizes are more useful than tight
# release sizing right now.
# Later trimming command: lower these after thread_analyzer shows stable margin.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=4
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Console and formatted output. printk/stdout/UART console are used by Zephyr
# logging and serial bring-up; floating-point printf is used for engineering
# telemetry and calibration/status text.
# Later removal command: set CONFIG_CBPRINTF_FP_SUPPORT=n if all formatted
# floats are removed from console/MQTT responses.
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=128

# Stack initialization and automatic thread reports catch stack margin problems.
# The analyzer is intentionally noisy-but-bounded at 20 s, not a fast loop.
# Later removal command: set CONFIG_THREAD_ANALYZER_AUTO=n, then disable
# CONFIG_THREAD_ANALYZER and CONFIG_INIT_STACKS when stack sizes are settled.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=20

# JSON parsing/formatting is used by command payloads and MQTT/status messages.
# Attenuator, MEMS route-loss, photodiode calibration, and throughput commands
# parse numeric JSON fields as float/double; without JSON FP support those fields
# look missing even when the payload contains them.
CONFIG_JSON_LIBRARY=y
CONFIG_JSON_LIBRARY_FP_SUPPORT=y

# Scientific math for attenuator transmission models.
CONFIG_ZSL=y

# COO Commons library and app defaults. These are app-level defaults; persisted
# settings can override broker/DNS/NTP values at runtime.
CONFIG_COO_COMMONS=y
CONFIG_COO_NETWORK=y
CONFIG_COO_MQTT=y
CONFIG_COO_JSON=y
CONFIG_COO_CMD_SERIAL_GUARD=y
CONFIG_COO_CMD_SERIAL_GUARD_DEFAULT_SECONDS=30
CONFIG_COO_MQTT_BROKER_HOSTNAME="hispec.caltech.edu"
CONFIG_COO_MQTT_BROKER_PORT="1883"
CONFIG_COO_MQTT_PAYLOAD_SIZE=1024
CONFIG_NETWORK_HELPER_FALLBACK_IPV4_ADDR="192.168.88.2"
CONFIG_NETWORK_HELPER_FALLBACK_IPV4_NETMASK="255.255.255.0"
CONFIG_NETWORK_HELPER_FALLBACK_IPV4_GW="0.0.0.0"
CONFIG_APP_DEFAULT_DNS_SERVER="8.8.8.8"
# time.nist.gov resolved IPv4; app settings currently store NTP as IPv4 only.
CONFIG_APP_DEFAULT_NTP_SERVER="132.163.96.4"


# I2C bus core. Device drivers below are selected by devicetree/Kconfig, but the
# bus subsystem itself is explicit because most board devices depend on it.
CONFIG_I2C=y


# DAC support for attenuators. CONFIG_DAC7X78 is the out-of-tree DAC7578/DAC7678
# module driver from west.yml; DAC nodes in the overlay instantiate devices.
CONFIG_DAC=y
CONFIG_DAC7X78=y



# GPIO, 1-Wire, and external GPIO expanders. DS2408 is explicit because it is an
# out-of-tree driver; W1/DS18B20 support is used for housekeeping temperature.
CONFIG_GPIO=y
CONFIG_W1=y
CONFIG_W1_NET=y
CONFIG_W1_ZEPHYR_GPIO=y
CONFIG_GPIO_DS2408=y
# DS2408 must initialize before GPIO hogs can apply overlay defaults to DS2408
# pins. Keep this ordering paired with the overlay relay defaults.
CONFIG_GPIO_DS2408_INIT_PRIORITY=80
CONFIG_GPIO_HOGS_INIT_PRIORITY=90

# PCAL64XXA is selected by its devicetree compatible when the node is enabled.
# It is intentionally left commented to document the dependency without forcing
# the driver globally. Removal command: delete this commented line once stable.
# CONFIG_GPIO_PCAL64XXA=y

# ADC for photodiodes. ADS1X1X is selected by devicetree, so the commented line
# is a reminder rather than a needed enable. Removal command: delete the comment
# if the overlay remains the only ADC source of truth.
CONFIG_ADC=y
# CONFIG_ADC_ADS1X1X=y

# Sensor core is needed by DS18B20 and STM32 internal sensors. LED is currently
# board-diagnostic support; if no LED diagnostics remain, it is a trim candidate.
# Later removal command for LED: set CONFIG_LED=n and remove LED devicetree use.
CONFIG_SENSOR=y
CONFIG_LED=y

# UART and Modbus for Maiman lasers. UART interrupt-driven mode is required by
# Zephyr serial/Modbus RTU paths. UART line control is disabled because RS-485
# direction control is not currently using RTS/DTR line-control APIs.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=n
CONFIG_MODBUS=y
CONFIG_MODBUS_SERIAL=y
CONFIG_MODBUS_ROLE_CLIENT=y
# Maiman reference tooling uses 115200 8N1. Zephyr's compliant Modbus default
# forces no-parity RTU to 2 stop bits unless this option is enabled.
CONFIG_MODBUS_NONCOMPLIANT_SERIAL_MODE=y

# Storage: direct NVS for persistent app settings. MPU flash write permission is
# required on this SoC so NVS can update the flash partition at runtime.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Watchdog and reboot support. Reboot is used by commands and watchdog recovery paths.
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

# Network stack: Ethernet, IPv4, TCP/UDP, DHCP. IPv6 is explicitly off to keep
# address handling and memory use focused during bring-up.
CONFIG_NETWORKING=y
CONFIG_NET_LOG=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n

# Connection manager and static fallback settings. NET_CONFIG_* values are
# currently development fallbacks; app settings and DHCP can supersede them.
# Later removal command: delete NET_CONFIG_MY_* once field addressing policy is
# finalized and tested through app settings/DHCP only.
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_BUF_RX_COUNT=100
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1600
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=6
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.111"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# DNS and time sync. DNS is needed for broker/NTP names; SNTP owns wall-clock
# sync and is also backed by the numeric app default above.
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_SNTP=y

# Sockets for MQTT. TLS is off for the current internal broker path; enabling it
# later will require certificate storage and larger socket/MQTT buffers.
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n

# MQTT library. MQTT v5 is used by the command/status path; keep TLS paired with
# the socket TLS setting above.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_KEEPALIVE=60
CONFIG_MQTT_VERSION_5_0=y

# Random number generation. STM32 entropy is preferred; TEST_RANDOM_GENERATOR is
# a development fallback that prevents networking/MQTT bring-up from blocking on
# entropy policy. Remove before production security review if true randomness is
# required: set CONFIG_TEST_RANDOM_GENERATOR=n and verify STM32 entropy remains.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
