# HiSPEC timing-debug configuration fragment.
#
# Use as a separate build so normal firmware stays release-like:
#   ./.venv/bin/west build \
#     --board=nucleo_h563zi/stm32h563xx \
#     --build-dir ./hispec-tib/app/build-timing \
#     ./hispec-tib/app -- -DEXTRA_CONF_FILE=debug.conf
#
# This profile is for finding scheduler, CPU, stack, and thread-runtime causes
# of missed timing. It intentionally avoids CONFIG_DEBUG_OPTIMIZATIONS because
# -Og changes the timing we are trying to measure.

# Keep deferred logging and prevent timing-sensitive threads from blocking on a
# full log buffer. Periodic analyzer output is useful but non-critical.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048


CONFIG_COO_MQTT_LOG_LEVEL_INF=y
CONFIG_NVS_LOG_LEVEL_DBG=n
CONFIG_ADC_LOG_LEVEL_DBG=n
CONFIG_GPIO_LOG_LEVEL_DBG=n
CONFIG_I2C_LOG_LEVEL_DBG=n


# Thread inventory, names, and stack watermarks.
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Kernel runtime accounting. The timing-functions backend gives higher
# resolution than tick-derived accounting on this target.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_SCHED_THREAD_USAGE_AUTO_ENABLE=y

# Low-rate thread summaries: CPU share, longest scheduling frame, priority, and
# stack usage. The analyzer runs at the lowest app priority by default.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_ANALYZER_LONG_FRAME_PER_INTERVAL=y
CONFIG_THREAD_ANALYZER_PRINT_THREAD_PRIORITY=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y

# Coarse total CPU load every 10 s. This selects Zephyr tracing hooks, but uses
# only the lightweight built-in CPU-load logger in this first pass.
CONFIG_CPU_LOAD=y
CONFIG_CPU_LOAD_LOG_PERIODICALLY=10000

# Leave richer host-captured tracing off initially. If thread runtime stats show
# preemption or a specific actor but not root cause, move next to SystemView or
# Percepio with ST-LINK/SWO capture.
CONFIG_SEGGER_SYSTEMVIEW=n
CONFIG_PERCEPIO_TRACERECORDER=n


CONFIG_DEBUG_OPTIMIZATIONS=y