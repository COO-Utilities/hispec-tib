manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision:  e60d3379133c4315504e9113ecdcc05fbe552756  # planned update to 55303e23f59df42d3ba41f0e93ca2192240f804a
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6      # required by the ARM port for Cortex-M
          - hal_stm32    # required by the st32 nucleo board
    - name: zscilib
      remote: zephyrproject-rtos
      revision: bf1cbf1a1661521cf3f528db40d842b700ecd826  # planned update to b5668a80c02e8e0a8ca5f6debdbe1dc3e09e7f35
      path: modules/lib/zscilib
    # Out-of-tree DAC Driver for optical attenuators
    - name: dac7578
      url: https://github.com/CaltechOpticalObservatories/dac7578
      revision: cc375f8610f895c99a0f689d43fe052c6e0e7cf5
      path: modules/dac/dac7578
    # Out-of-tree DS2408 1-Wire GPIO driver (enable once repo exists)
    # - name: ds2408
    #   url: <your ds2408 repo url>
    #   revision: main
    #   path: modules/gpio/ds2408
